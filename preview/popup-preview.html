<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SB118 popup preview</title>
<style>
  :root{
    --bg:#0d1120; --card:#141a2e; --card-2:#1b2340; --tile:#1a2348; --tile-hover:#24305c;
    --chip:#222c50; --ink:#e7ecff; --muted:#93a1c9; --line:#28325a;
    --navy:#2f8fd0; --gold:#d0a24a; --ok:#4ade80; --staff-accent:#6aa9ff;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}

  /* ===== popup card (this block ports to popup.css, .popup -> body) ===== */
  .popup{width:360px;background:var(--bg);color:var(--ink);border-radius:14px;overflow:hidden;
    box-shadow:0 18px 50px rgba(6,10,25,.4);border:1px solid #1c2440}

  .ph{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;background:linear-gradient(180deg,#18203c,#141a2e);
    border-bottom:1px solid var(--line);box-shadow:inset 0 -2px 0 0 var(--gold)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.2px}
  .brand .logo{font-size:16px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.28);
    padding:3px 9px;border-radius:999px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .status.off{background:rgba(148,161,201,.1);border-color:rgba(148,161,201,.25)}
  .status.off .dot{background:#6b7280;box-shadow:none}

  .search{padding:12px 14px 4px}
  .search input{width:100%;padding:9px 11px 9px 32px;border-radius:9px;border:1px solid #2a3563;
    background-color:#0f1630;color:var(--ink);font-size:13px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%2393a1c9' stroke-width='2' stroke-linecap='round'><circle cx='6' cy='6' r='4.5'/><line x1='9.5' y1='9.5' x2='13' y2='13'/></svg>");
    background-repeat:no-repeat;background-position:11px center}
  .search input::placeholder{color:#6b7aa5}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px 4px}
  .grid a{display:flex;flex-direction:column;align-items:center;gap:5px;
    background:var(--tile);border:1px solid #232d55;border-radius:10px;padding:11px 4px;
    color:var(--ink);text-decoration:none;font-size:11px;font-weight:500;transition:background .12s,transform .12s}
  .grid a:hover{background:var(--tile-hover);transform:translateY(-1px)}
  .grid a .ic{font-size:17px;line-height:1}

  .sec{padding:12px 14px;border-top:1px solid var(--line)}
  .sec:first-of-type{border-top:0}
  .lbl{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid #2c3767;
    border-radius:8px;padding:6px 11px;color:var(--ink);text-decoration:none;font-size:12.5px;
    transition:background .12s}
  .chip:hover{background:#2c3767}
  .chip .x{margin-left:2px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
  .chip.add{border-style:dashed;color:var(--muted);background:transparent}

  .announce{margin-top:9px;font-size:12.5px;color:#c3cdf0;line-height:1.4}
  .announce .a-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #1a2240}
  .announce .a-item:last-child{border-bottom:0}
  .announce .a-dot{color:var(--gold)}

  .staff{background:linear-gradient(180deg,#0f1832,#0d142a);border-top:1px dashed #33406b}
  .staff .lbl{color:var(--staff-accent)}
</style>
</head><body>
<div class="popup">
  <div class="ph">
    <span class="brand"><span class="logo">🛰</span> StarBase 118</span>
    <span class="status"><span class="dot"></span> Signed in</span>
  </div>

  <div class="search"><input placeholder="Search SB118…" disabled></div>

  <nav class="grid" aria-label="Quick launch">
    <a><span class="ic">🏛</span>HQ</a>
    <a><span class="ic">📖</span>Wiki</a>
    <a><span class="ic">💬</span>Discord</a>
    <a><span class="ic">🌐</span>Main site</a>
    <a><span class="ic">📜</span>Sim archive</a>
  </nav>

  <section class="sec">
    <span class="lbl">My stuff</span>
    <div class="chips">
      <a class="chip">👤 Wolf</a>
      <a class="chip">🚀 USS Narendra</a>
    </div>
  </section>

  <section class="sec">
    <span class="lbl">Pinned</span>
    <div class="chips">
      <a class="chip">★ Duty roster <button class="x">✕</button></a>
      <a class="chip">★ Species DB <button class="x">✕</button></a>
      <a class="chip add">＋ Pin tab</a>
    </div>
  </section>

  <section class="sec">
    <span class="lbl">Announcements</span>
    <div class="announce">
      <div class="a-item"><span class="a-dot">◆</span><span>Awards ceremony scheduled for August 2</span></div>
      <div class="a-item"><span class="a-dot">◆</span><span>New ship commissioned: USS Artemis</span></div>
    </div>
  </section>

  <section class="sec staff">
    <span class="lbl">Staff</span>
    <div class="chips">
      <a class="chip">Forums</a>
      <a class="chip">Authentik</a>
      <a class="chip">n8n</a>
      <a class="chip">Forum admin</a>
    </div>
  </section>
</div>
</body></html>
