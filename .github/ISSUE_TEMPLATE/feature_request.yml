name: Feature suggestion
description: Suggest something the extension should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the solution — what were you doing when you
        wished the extension did this?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      options:
        - Every member
        - Staff only
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links, or an example of another tool doing it well.
